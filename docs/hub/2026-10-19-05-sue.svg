<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><title>A requirement needs a trace, not a tick</title><rect width="800" height="500" fill="#f7f4ec"/><text x="40" y="55" font-family="sans-serif" font-size="30" fill="#183b43">A trace, not a tick</text><text x="40" y="95" font-family="sans-serif" font-size="24" fill="#42575b">What would prove this requirement?</text><rect x="40" y="130" width="720" height="65" rx="12" fill="#183b43"/><text x="65" y="173" font-family="sans-serif" font-size="28" fill="#ffffff">Requirement</text><path d="M400 195 V220 M400 285 V310 M400 375 V400" fill="none" stroke="#426b70" stroke-width="4"/><rect x="40" y="220" width="720" height="65" rx="12" fill="#d5e8df"/><text x="65" y="263" font-family="sans-serif" font-size="26" fill="#183b43">Observable + test example + checker</text><rect x="40" y="310" width="720" height="65" rx="12" fill="#d5e8df"/><text x="65" y="353" font-family="sans-serif" font-size="28" fill="#183b43">Evidence the check would produce</text><rect x="40" y="400" width="720" height="65" rx="12" fill="#f1d69a"/><text x="65" y="443" font-family="sans-serif" font-size="28" fill="#183b43">Status: PROPOSED, not passed</text></svg>