<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><title>A promise you can inspect</title><rect width="800" height="500" fill="#102232"/><text x="36" y="52" fill="#ffffff" font-family="sans-serif" font-size="34">What does Submit promise?</text><text x="36" y="88" fill="#b9d8e8" font-family="sans-serif" font-size="25">PROPOSAL · not executing software</text><rect x="36" y="112" width="728" height="66" rx="12" fill="#213d50"/><text x="56" y="140" fill="#79e0c0" font-family="sans-serif" font-size="22">INITIAL STATE</text><text x="56" y="168" fill="#ffffff" font-family="sans-serif" font-size="27">Draft ready. Nothing submitted.</text><rect x="36" y="190" width="728" height="66" rx="12" fill="#213d50"/><text x="56" y="218" fill="#79e0c0" font-family="sans-serif" font-size="22">HUMAN ACTION</text><text x="56" y="246" fill="#ffffff" font-family="sans-serif" font-size="27">Choose Submit for review.</text><rect x="36" y="268" width="728" height="66" rx="12" fill="#213d50"/><text x="56" y="296" fill="#79e0c0" font-family="sans-serif" font-size="22">VISIBLE CONSEQUENCE</text><text x="56" y="324" fill="#ffffff" font-family="sans-serif" font-size="27">Received for review. Not accepted.</text><rect x="36" y="346" width="728" height="66" rx="12" fill="#493c32"/><text x="56" y="374" fill="#ffd08a" font-family="sans-serif" font-size="22">IF SUBMISSION FAILS</text><text x="56" y="402" fill="#ffffff" font-family="sans-serif" font-size="27">Show error. Keep draft. No silent retry.</text><text x="36" y="456" fill="#ffffff" font-family="sans-serif" font-size="27">Check each step against the promise.</text><text x="36" y="489" fill="#b9d8e8" font-family="sans-serif" font-size="23">A walkthrough is not proof of execution.</text></svg>