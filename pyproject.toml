[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "handoffs"
version = "0.1.0"
description = "HANDOFFS task service prototype"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "sqlalchemy", "alembic", "tzdata", "mcp>=1.10,<2", "httpx"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["app*"]
