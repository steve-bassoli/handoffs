<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Commons · MIN</title>
<style>
  :root { color-scheme: light dark; --ink: #1d1a17; --paper: #faf7f2; --line: #d9d2c7; --accent: #3d5a4c; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ece7df; --paper: #161513; --line: #3a3732; --accent: #9fc3b1; } }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.5 system-ui, sans-serif; }
  main { max-width: 36rem; margin: 0 auto; padding: 3rem 1rem 4rem; }
  h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 1.5rem; }
  .eyebrow { font-size: .85rem; letter-spacing: .04em; text-transform: uppercase; opacity: .75; margin: 0 0 .5rem; }
  .choices { display: grid; gap: .75rem; margin: 0 0 2rem; }
  .choice { display: block; width: 100%; text-align: left; padding: 1rem 1.1rem; border: 1px solid var(--line); border-radius: .75rem;
            background: transparent; color: inherit; font: inherit; text-decoration: none; cursor: pointer; }
  .choice:hover, .choice:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }
  .choice small { display: block; opacity: .7; font-size: .85rem; margin-top: .2rem; }
  button.link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; text-decoration: underline; cursor: pointer; }
  .min-footer { margin-top: 2rem; font-size: .9rem; }
  .min-footer a { color: var(--accent); }
</style>
</head>
<body>
<main id="min-root"></main>
<script src="/static/min.js"></script>
</body>
</html>
